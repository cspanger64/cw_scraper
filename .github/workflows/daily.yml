name: Daily Crossword

on:
  schedule:
    - cron: "0 15 * * *"   # 15:00 UTC = 3 PM UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate puzzle-mini.json and puzzle-midi.json
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python -u -m scraper.run

      - name: Commit updated puzzles if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in docs/puzzle-mini.json docs/puzzle-midi.json; do
            if [ -f "$f" ]; then
              git add "$f"
            else
              echo "$f does not exist on disk this run, skipping"
            fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Update daily puzzles: $(date -u +'%Y-%m-%d')"
            git push
          else
            echo "No changes to commit"
          fi
