name: Daily Crossword

on:
  schedule:
    - cron: "0 15 * * *"   # 15:00 UTC = 3 PM UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate puzzle-mini.json and puzzle-midi.json
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python -u -m scraper.run

      - name: Commit updated puzzles if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- docs/puzzle-mini.json docs/puzzle-midi.json; then
            git add docs/puzzle-mini.json docs/puzzle-midi.json
            git commit -m "Update daily puzzles: $(date -u +'%Y-%m-%d')"
            git push
          else
            echo "No changes to puzzle-mini.json or puzzle-midi.json"
          fi
